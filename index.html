<script>
/* ===================================================================================================
   VANTA ZONE 1.5 "GRIT"  (what changed and why: docs/CHANGES_v1.5.md; earlier: CHANGES_v1.0-1.4)
   1.5 adds: a 40x40 city (4x the area) in five districts with buildings and landmarks, a new city every match,
   the "grit" look (one generated grime texture, half-Lambert light, colour grade, dust haze), perks as the second
   half of your loadout, district names on screen, and view-distance culling so it still runs on a weak phone.

   ART DIRECTION: "stylised grit"  (follow these rules for anything new)
   Not photo-real: like Fortnite or Valorant, the shapes and colours are simplified so you read the game instantly,
   and the GRIT lives in the surfaces (stains, rust, cracks, rain streaks, worn paint) instead of in polygons.
   1. SHAPE FIRST, COLOUR SECOND, GRIT THIRD. Silhouettes and big colour areas must read at a glance; grime only
      changes value a little and never hides a shape. Enemies are DARK with one hostile red-orange accent.
      Colour = meaning, never reused: mint = you / UI, red-orange = enemy, violet = storm, amber = armour,
      green = health, sky blue = weapon crate.
   2. HARD vs SOFT. Man-made things are crisp: flat facets (bevels where they show). Organic things are smooth.
   3. SOFT LIGHT, WARM SUN, COOL SHADOWS. Half-Lambert light (Team Fortress 2 / Valorant) keeps shadow sides readable;
      everything is grounded with baked ambient occlusion; a split-tone grade cools shadows and warms lights.
   4. EVERY DISTRICT HAS AN IDENTITY: its own floor, cover and one tall landmark you can navigate by.
   5. DETAIL WHERE YOU LOOK. Cover, enemies and your gun get the detail; the background is simple boxes in the haze.
   6. LAYERED FEEDBACK. Every hit = sound + spark + marker + body jolt; every shot = flash + recoil + a little shake.

   TECH: baked vertex colours x ONE 256px tiling grime texture (made in code), one sun. 1 tile = 1 world unit (~2.7 m).
   BUDGET for a weak phone: scenery = a few chunk meshes with light baked in, culled by view and by distance (the
   haze is thicker on LOW); each enemy = 7 small meshes; no real-time shadows; 30 FPS cap; fixed 1/60 s logic.
   =================================================================================================== */
const $=id=>document.getElementById(id);
const mm=$('mini'),m=mm.getContext('2d');
// ============================== 0. DEVICE ==============================
// Phone/tablet = touch controls, LOW quality, 30 FPS. Laptop/desktop = mouse + keyboard (or a PlayStation/Xbox pad), HIGH quality, 60 FPS.
// A coarse pointer (a finger) is the reliable signal; screen size alone isn't (big phones, small laptops).
const TOUCH=matchMedia('(pointer: coarse)').matches||(navigator.maxTouchPoints>0&&!matchMedia('(pointer: fine)').matches);
const DESK=!TOUCH;document.body.classList.add(TOUCH?'touch':'desk');
addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;top:0;right:0;z-index:99;background:#c00;color:#fff;font:11px monospace;padding:4px';d.textContent='ERR: '+e.message+' @'+e.lineno;document.body.appendChild(d)}); // shows any script error on screen

// ============================== 1. MAP ==============================
// 0 = floor. 1 = concrete barrier, 2 = shipping container, 3 = stacked crates, 4 = building.
// The map is a 40x40 CITY (4x the area of 1.4's arena) in five DISTRICTS, each with its own look, cover and landmark:
//   NW container yard · NE old town · SW the ruins · SE rail depot · centre plaza, joined by two cross roads.
// Every match generates a NEW city (genCity). The firing range and the menu always use the same one (fixed seed),
// so range scores stay comparable.
const MW=40,NN=MW*MW,MC=MW/2;                                    // map size (tiles) and centre
const GRID=new Uint8Array(NN);                                   // the live layout (row-major, MW x MW)
const cell=(x,y)=>{x=Math.floor(x);y=Math.floor(y);return x<0||y<0||x>=MW||y>=MW?1:GRID[y*MW+x]};
const inMap=(x,y)=>x>=0&&y>=0&&x<MW&&y<MW;
const DNAME=['CONTAINER YARD','OLD TOWN','THE RUINS','RAIL DEPOT','CENTRAL PLAZA'];
const district=(x,y)=>Math.abs(x-MC)<6.5&&Math.abs(y-MC)<6.5?4:(x<MC?(y<MC?0:2):(y<MC?1:3));
const onRoad=(x,y)=>(x>=17&&x<=22)||(y>=17&&y<=22),isRoad=(x,y)=>district(x,y)!=4&&onRoad(x,y);   // the cross roads between districts
// LANDMARK cells: drawn as something special instead of a plain block (cell -> height used for bullet impacts).
// Crane legs (yard), fuel tank (depot), monument (plaza). The ruins' radio mast and the town's water tower sit on normal blocks.
const LMK=new Map([[9*MW+4,1.15],[9*MW+13,1.15],[26*MW+31,1.7],[26*MW+32,1.7],[27*MW+31,1.7],[27*MW+32,1.7],[19*MW+19,1.1],[19*MW+20,1.1],[20*MW+19,1.1],[20*MW+20,1.1]]);
const MAST=30*MW+8;                                              // the radio mast stands on this block in the ruins
// SPAWN PADS: the four ends of the cross roads (always open). You start on one, facing the middle.
const PADS=[{x:19.5,y:37.5,a:-Math.PI/2},{x:20.5,y:2.5,a:Math.PI/2},{x:2.5,y:20.5,a:0},{x:37.5,y:19.5,a:Math.PI}];
// A small seeded random generator, so a fixed seed always gives the same city (range + menu).
const seeded=s=>()=>(s=s*16807%2147483647)/2147483647;
// CITY GENERATOR. Each district places its own kind of cover with its own rules, then:
//  - the roads and plaza are cleared, and get scattered cover so they're never empty shooting galleries
//  - landmark cells are forced into place
//  - CONNECTIVITY: flood-fill from a spawn pad; any floor pocket it can't reach gets a wall next to it opened up,
//    repeated until every floor tile can be reached. So it always succeeds (no fallback map needed).
function genCity(R0){
 const ri=(a,b)=>a+(R0()*(b-a+1)|0),ch=a=>a[R0()*a.length|0];
 const put=(x,y,t)=>{if(x>0&&y>0&&x<MW-1&&y<MW-1)GRID[y*MW+x]=t},rect=(x0,y0,w,h,t)=>{for(let y=y0;y<y0+h;y++)for(let x=x0;x<x0+w;x++)put(x,y,t)};
 GRID.fill(0);for(let i=0;i<MW;i++){GRID[i]=GRID[(MW-1)*MW+i]=GRID[i*MW]=GRID[i*MW+MW-1]=1}
 // NW CONTAINER YARD: rows of 2-3 long containers (some stacked two deep), crates in the lanes
 for(const yy of[3,7,11,15]){let x=2+ri(0,1);
  while(x<15){const ln=ch([2,3,3]);
   if(R0()<.8){if(R0()<.55){rect(x,yy,Math.min(ln,16-x),1,2);if(R0()<.35)rect(x,yy+1,Math.min(ln,16-x),1,2)}else rect(x,yy,1,Math.min(ln,17-yy),2)}
   x+=ln+ch([2,2,3])}}
 for(let i=0;i<6;i++)put(ri(2,15),ri(2,15),3);
 // NE OLD TOWN: blocks of buildings on a street grid; block sizes vary every match, some corners are cut away (courtyards)
 for(const[x0,ws]of[[23,[2,3]],[28,[2,3]],[33,[3,4]]])for(const[y0,hs]of[[2,[2,3]],[7,[2,3]],[12,[3,4]]]){
  if(R0()<.1){put(x0+1,y0+1,3);continue}                            // an empty lot with some crates
  const w=ch(ws),h=ch(hs);rect(x0,y0,w,h,4);
  if(R0()<.5)put(x0+ch([0,w-1]),y0+ch([0,h-1]),0)}
 // SW RUINS: broken walls (some L-shaped) and half-collapsed buildings, rubble crates
 for(let i=0;i<17;i++){const x=ri(2,15),y=ri(23,36);
  if(R0()<.45){const L=ri(2,4);if(R0()<.5){rect(x,y,L,1,1);if(R0()<.6)rect(x,y,1,ri(2,3),1)}else rect(x,y,1,L,1)}
  else{rect(x,y,ch([2,3]),2,4);put(x+ri(0,1),y+ri(0,1),0)}}
 for(let i=0;i<8;i++)put(ri(2,16),ri(23,37),3);

const wrapA=a=>Math.atan2(Math.sin(a),Math.cos(a));
// A springy value: it chases 0 with a little overshoot, like a body absorbing a jolt (recoil, getting hit).
function spring(s,dt){s.v+=(-s.x*160-s.v*14)*dt;s.x+=s.v*dt}
// Returns true on the frame a foot lands (for footstep sounds).
function animate(b,dt){
 // 1) TURN at a human rate instead of snapping round instantly
 const maxT=(b.ty==1?7:4.5)*dt,turn=Math.max(-maxT,Math.min(maxT,wrapA(b.face-b.yaw)));
 b.yaw+=turn;b.turnRate+=(turn/dt-b.turnRate)*ez(10,dt);
 // 2) STRIDE: the legs cycle by distance actually covered, and the swing angle matches the step length, so feet plant instead of sliding
 const sp=b.mv*LV[lvl].spd*b.sp;                                  // real speed in tiles/sec
 const L=.55+.25*Math.min(1,sp/1.8),fade=Math.min(1,sp/.5);         // stride length (longer when running), 0..1 blend from standing
 const amp=Math.asin(Math.min(.9,L/(4*HIP)))*fade;                 // leg swing that produces that stride
 const prev=b.phase;b.phase+=sp*dt/L*Math.PI*2;
 const rel=wrapA(b.mvA-b.yaw),cr=Math.cos(rel),sr=Math.sin(rel);  // walking direction relative to facing: forward, sideways or backward
 for(let i=0;i<2;i++){const lg=b.legs[i],ph=b.phase+i*Math.PI,s=Math.sin(ph)*amp;
  lg.th.rotation.x=-s*cr;lg.th.rotation.z=s*sr;                      // swing the leg along the walking direction
  lg.sh.rotation.x=.06+Math.max(0,Math.cos(ph))*amp*1.6}              // knee bends while that leg swings through
 // 3) BODY: hips dip as the legs spread, shoulders counter-twist, torso leans into speed and into turns, chest breathes when still
 const s=Math.sin(b.phase)*amp;
 b.lean+=(Math.max(-.12,Math.min(.2,sp*cr*.09))-b.lean)*ez(6,dt);
 spring(b.kick,dt);
 b.upper.rotation.set(b.lean+b.kick.x+Math.sin(time*2.1+b.ph)*.015*(1-fade),-s*.3*cr,Math.sin(b.phase)*.035*fade);
 b.G.rotation.set(0,b.yaw,-b.turnRate*.03*Math.min(1,sp));
 b.G.position.y=-HIP*(1-Math.cos(s))*b.sc;
 return fade>.5&&Math.floor(prev/Math.PI)!==Math.floor(b.phase/Math.PI)}
// Death: knees give way (feet stay planted), he slumps, then topples backwards (away from the shot), legs straightening as he lands.
// Cleared away a few seconds later.

// Enemies only know where you are if one of them SEES you, HEARS you (gunfire, sprinting close by), or a squadmate
// CALLS IT OUT. Each enemy is in one state at a time:
//   patrol: wander inside the storm (nobody knows where you are)
//   hunt:   head for your last known position; if you're not there, go back to patrolling
//   fight:  can see you: strafe / hold / back off depending on kit, shoot when it's his turn
//   cover:  shot at or nearly hit: run to the nearest spot you can't see, wait, then peek out again
//   flank:  (Standard) circle round to your side while a squadmate keeps you busy

// Distance field from a goal cell (the same BFS as above); an enemy walks "downhill" along it around walls
function field(f,goal){f.fill(-1);let h=0,t=0;f[goal]=0;BQ[t++]=goal;
 while(h<t){const c=BQ[h++],cx=c%MW,cy=c/MW|0;for(let k=0;k<4;k++){const nx=cx+(k==0)-(k==1),ny=cy+(k==2)-(k==3);if(nx<0||ny<0||nx>MW-1||ny>MW-1)continue;const n=ny*MW+nx;if(f[n]<0&&!cell(nx,ny)){f[n]=f[c]+1;BQ[t++]=n}}}}
function follow(b,f,ang){const cx=b.x|0,cy=b.y|0;let best=f[cy*MW+cx],bx=-1,by=0;if(best<0)return ang;
 for(let k=0;k<8;k++){const dx=k<4?(k==0)-(k==1):(k==4||k==5?1:-1),dy=k<4?(k==2)-(k==3):(k==4||k==6?1:-1),nx=cx+dx,ny=cy+dy;
  if(nx<0||ny<0||nx>MW-1||ny>MW-1||cell(nx,ny)||(k>3&&(cell(cx+dx,cy)||cell(cx,cy+dy))))continue;const v=f[ny*MW+nx];if(v>=0&&v<best){best=v;bx=nx;by=ny}}

function setGoal(b,c){b.goal=c;field(b.f,c)}
function wander(){const r=stormR()*.8;for(let k=0;k<40;k++){const x=ST.x+(Math.random()*2-1)*r,y=ST.y+(Math.random()*2-1)*r;if(inMap(x|0,y|0)&&!cell(x,y)&&Math.hypot(x-ST.x,y-ST.y)<r)return(y|0)*MW+(x|0)}return cellOf({x:ST.x1,y:ST.y1})}

  if(c!==s0){const px=cx+.5,py=cy+.5,dx=INTEL.x-px,dy=INTEL.y-py,dd=Math.hypot(dx,dy)||1;cast(px,py,dx/dd,dy/dd);

// ============================== 18. MAIN LOOP, QUALITY, PAUSE, OPTIONS ==============================
// render scale range, start, FPS cap, and VIEW DISTANCE: the dust haze thickens on weaker settings, and whole chunks of the city
// past the haze aren't drawn at all (the big saving on a phone). The laptop setting keeps the long view to the skyline.
const QS=[{n:'LOW',lo:.45,hi:.8,st:.6,fps:30,fn:7,ff:30,vd:33},{n:'MED',lo:.6,hi:1,st:.8,fps:30,fn:10,ff:48,vd:52},{n:'HIGH',lo:.8,hi:1.25,st:1,fps:60,fn:16,ff:125,vd:999}];
const STEP=1/60;let last=performance.now(),acc=0,ceil=9,good=0,paused=0;
function loop(n){requestAnimationFrame(loop);
 const q=QS[ql];if(n-last<1000/q.fps-3)return;        // frame cap (3 ms slack for timing jitter)
 const dt=Math.min(.1,(n-last)/1000);last=n;           // real elapsed time, capped so a long hitch can't teleport you
 if(paused)return;                                     // pause screen covers everything: draw nothing
 if(over){menuView(dt);return}                         // behind the menus: slow fly-around of the arena
 acc+=dt;while(acc>=STEP){snap();update(STEP);acc-=STEP;if(over)break}
 draw(dt,Math.min(1,acc/STEP));
 fc++;ft+=dt;if(ft>2){fps=fc/ft;fc=ft=0;autoRes(q);if(showF||RANGE())sT(fpsEl,Math.round(fps)+' FPS · '+Math.round(1000/fps)+' ms · '+pr.toFixed(2)+'x')}}  // the range always shows FPS
// Menu background: the camera circles the arena while enemies idle. Drawn at ~15 FPS: plenty behind a menu, saves battery.
let mT=0,mF=0;
function menuView(dt){mT+=dt;if(mF^=1)return;for(const W of[STATIC,arena])for(const me of W.meshes)me.visible=true;
 const a=mT*.05;cam.position.set(MC+Math.cos(a)*14,4.4,MC+Math.sin(a)*14);cam.lookAt(MC,1,MC);VM.visible=false;
 if(cam.fov!==72){cam.fov=72;cam.updateProjectionMatrix()}
 for(const b of bots)if(b.hp>0){b.mv=0;animate(b,dt*2);b.G.visible=true;b.G.position.x=b.x;b.G.position.z=b.y}
 CLOUDS.rotation.y+=dt*.008;
 R.render(scene,cam)}
// Auto resolution, checked every 2 s: below 85% of the cap -> 0.1 lower (and that becomes the ceiling); at the cap twice -> 0.1 higher.
function autoRes(q){const hi=Math.min(window.devicePixelRatio||1,q.hi),lo=Math.min(q.lo,hi);
 if(fps<q.fps*.85&&pr>lo+.001){pr=Math.max(lo,pr-.1);ceil=pr;good=0;R.setPixelRatio(pr);size()}
 else if(fps>=q.fps*.95&&pr+.1<=Math.min(hi,ceil)+.001){if(++good>=2){good=0;pr+=.1;R.setPixelRatio(pr);size()}}
 else good=0}
let starting=false;
function start(){if(starting)return;ac();
 if(DESK)lockMouse();                                  // ask for the mouse / fullscreen first, while the click still counts as a user action
 else try{document.documentElement.requestFullscreen().then(()=>screen.orientation.lock('landscape')).catch(()=>{})}catch(e){}
 ['start','end','pause','settings'].forEach(i=>$(i).style.display='none');
 const f=$('fade');f.style.transition='none';f.style.opacity=1;starting=true;
 // Building a new arena takes a moment on a weak phone, so it happens BEHIND the black fade (next frame), not on top of a frozen menu.
 requestAnimationFrame(()=>setTimeout(()=>{starting=false;
  reset(true);snap();zoneCur=-1;
  R.compile(scene,cam);   // build every shader now, so the first fight doesn't stutter
  acc=0;fc=ft=0;last=performance.now();paused=0;
  TUT=!PRO.tut&&!RANGE()?{i:0,tt:0,mv:0,lk:0,la:P.a,lp:P.pit,sh:0,s0:0,ad:0}:null;$('tut').style.display=TUT?'flex':'none';tutStep();
  requestAnimationFrame(()=>{f.style.transition='';f.style.opacity=0});banner(TUT?'TRAINING':RANGE()?'FIRING RANGE':'DROP IN');fpsEl.style.display=showF||RANGE()?'block':'none';
  document.body.classList.remove('menu');
  if(gyS&&!gyN)setTimeout(()=>{if(!gyN)feed('Gyro unavailable here')},1500)},0))}
function toMenu(){['end','pause','settings'].forEach(i=>$(i).style.display='none');$('start').style.display='flex';$('tut').style.display='none';TUT=null;
 document.body.classList.add('menu');rankUI();lab()}
$('deploy').onclick=start;$('redo').onclick=start;$('emenu').onclick=toMenu;
$('quit').onclick=()=>{over=true;paused=0;unlock();$('out').style.opacity=0;$('low').style.opacity=0;toMenu();try{AC&&AC.resume()}catch(e){}};
$('cog').onclick=()=>{$('start').style.display='none';$('settings').style.display='flex'};
$('sback').onclick=()=>{$('settings').style.display='none';$('start').style.display='flex'};
// Pause when you leave the app: stops the match, mutes sound, releases any stuck thumbs.
function clearInput(){joy.id=look.id=fid=null;joy.dx=joy.dy=look.dx=look.dy=look.vx=look.vy=0;held.f=held.s=held.a=held.f2=0;fbuf=0;
 [jb,jk,rb,rk].forEach(e=>e.style.display='none');document.querySelectorAll('.btn.on').forEach(e=>e.classList.remove('on'));for(const k in keys)keys[k]=0}
function pause(){if(over||paused)return;paused=1;clearInput();unlock();   // always release the mouse, or the pause buttons can't be clicked
 $('pause').style.display='flex';document.body.classList.add('menu');$('tut').style.display='none';try{AC&&AC.suspend()}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
$('bp').addEventListener('pointerdown',e=>{e.preventDefault();pause()});   // on-screen pause button
$('resume').onclick=()=>{lockMouse();paused=0;$('pause').style.display='none';document.body.classList.remove('menu');if(TUT)$('tut').style.display='flex';ac();acc=0;fc=ft=0;last=performance.now()};
// SETTINGS (saved on the device). Kept off the main menu so the first screen is just: rank, DEPLOY, mode, gun, daily challenge.
const opts=$('opts'),mkb=id=>{const b=document.createElement('button');b.className='go sm';b.id=id;opts.appendChild(b);return b};
const bFa=mkb('fa'),bGy=mkb('gy'),bQl=mkb('ql'),bLs=mkb('ls'),bIv=mkb('iv'),bSk=mkb('sk'),bFp=mkb('fp'),bSn=mkb('sn'),bTu=mkb('tu'),GYL=['OFF','ON','YAW FLIP','PITCH FLIP','BOTH FLIP'];
const fpsEl=document.createElement('div');fpsEl.className='pill';fpsEl.style.cssText='position:absolute;left:12px;top:114px;font-size:11px;display:none';$('hud').appendChild(fpsEl);
const gunOK=w=>rankOf(PRO.xp)>=GUN_RANK[w],skinOK=i=>rankOf(PRO.xp)>=SKIN_RANK[i];
const lab=()=>{$('lv').textContent='MODE: '+['TRAINING','STANDARD','RANGE'][lvl];$('lo').textContent='GUN: '+WPN[PRO.lo|0].n;$('pk').textContent='PERK: '+PERK[PRO.pk|0].n;
 bFa.textContent='AUTO-FIRE: '+(af?'ON':'OFF');bGy.textContent='GYRO: '+GYL[gyS];bQl.textContent='QUALITY: '+QS[ql].n;bLs.textContent='LOOK: '+SENSL[sens];bIv.textContent='INVERT Y: '+(inv?'ON':'OFF');
 bSk.textContent='SHAKE: '+(shake?'ON':'OFF');bFp.textContent='FPS: '+(showF?'ON':'OFF');bSn.textContent='FINISH: '+SKINS[PRO.skin|0].n;bTu.textContent=PRO.tut?'REPLAY TUTORIAL':'TUTORIAL: NEXT MATCH';fpsEl.style.display=showF?'block':'none'};
const sv=()=>{try{localStorage.vz=JSON.stringify({v:6,af,gyS,ql,lvl,showF,sens,shake,inv})}catch(e){}};
function applyQ(){const q=QS[ql],hi=Math.min(window.devicePixelRatio||1,q.hi);pr=Math.min(q.st,hi);ceil=9;good=0;R.setPixelRatio(pr);size();
 if(!!WORLDM.defines.LOWQ!==(ql==0)){WORLDM.defines=ql==0?{LOWQ:1}:{};WORLDM.needsUpdate=true}
 WORLDM.uniforms.fn.value=scene.fog.near=q.fn;WORLDM.uniforms.ff.value=scene.fog.far=q.ff;VD=q.vd}
try{const o=JSON.parse(localStorage.vz||'{}');if(o.af!==undefined)af=o.af;if(o.gyS!==undefined)gyS=o.gyS;if(o.lvl!==undefined)lvl=o.lvl;
 if(o.v>=5){if(o.ql!==undefined)ql=o.ql;showF=o.showF|0;if(o.shake!==undefined)shake=o.shake;if(o.sens!==undefined)sens=o.v===5?o.sens+1:o.sens;inv=o.inv|0}}catch(e){}   // v5 had 3 look speeds; v6 has 5
if(!gunOK(PRO.lo|0))PRO.lo=0;if(!skinOK(PRO.skin|0))PRO.skin=0;if(PRO.skin)applySkin(PRO.skin);
if(DESK){bGy.style.display='none';                 // no gyro on laptops
 $('hint').textContent='Click DEPLOY or press Enter · Esc pauses';
 $('ctl').innerHTML='W A S D move · Mouse look · Left click fire · Right click scope · Shift sprint · R reload<br>1 / 2 or mouse wheel swap guns · F take a gun from a crate · Esc or P pause<br>PlayStation / Xbox pad: sticks · R2 fire · L2 scope · L3 sprint · Square/X reload · Triangle/Y swap'}
else{$('hint').textContent='Hold your phone sideways · tip: “Add to Home screen” for true full screen';
 $('ctl').innerHTML='Left thumb moves · right thumb looks (push further = faster) · hold FIRE (or a 2nd finger on the right) · hold AIM to scope<br>SWAP switches guns, or TAKES one you are standing on · AUTO-FIRE shoots when your crosshair is on someone'}
$('lv').onclick=()=>{lvl=(lvl+1)%3;lab();sv()};
$('lo').onclick=()=>{let w=PRO.lo|0;for(let k=0;k<3;k++){w=(w+1)%3;if(gunOK(w))break}PRO.lo=w;savePro();lab();
 if(!gunOK(1))$('hint').textContent='More starting guns unlock at '+RANKN[1]+' and '+RANKN[3];else if(!gunOK(2))$('hint').textContent='LR-7 Marksman unlocks at '+RANKN[3]};
$('pk').onclick=()=>{PRO.pk=((PRO.pk|0)+1)%PERK.length;savePro();lab();$('hint').textContent=PERK[PRO.pk].n+': '+PERK[PRO.pk].d};
bFa.onclick=()=>{af^=1;lab();sv()};bGy.onclick=()=>{gyS=(gyS+1)%5;lab();sv()};bQl.onclick=()=>{ql=(ql+1)%3;applyQ();lab();sv()};bFp.onclick=()=>{showF^=1;lab();sv()};
bLs.onclick=()=>{sens=(sens+1)%SENS.length;lab();sv()};bIv.onclick=()=>{inv^=1;lab();sv()};bSk.onclick=()=>{shake^=1;lab();sv()};
bSn.onclick=()=>{let i=PRO.skin|0;for(let k=0;k<4;k++){i=(i+1)%4;if(skinOK(i))break}PRO.skin=i;savePro();applySkin(i);lab();
 if(!skinOK(1))bSn.textContent='FINISH: MINT · more at '+RANKN[4]};
bTu.onclick=()=>{PRO.tut=0;savePro();lab()};
applyQ();lab();rankUI();
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});   // offline play + faster loads on a weak connection
reset();snap();over=true;requestAnimationFrame(loop);
</script></body></html>
